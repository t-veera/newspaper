<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src file:; font-src file:; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The First Light</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Icon sprites -->
<svg class="sprites" width="0" height="0" aria-hidden="true">
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="i-part" viewBox="0 0 24 24"><circle cx="8.5" cy="8.5" r="3"/><path d="M8.5 2v1.5M2 8.5h1.5M3.9 3.9l1 1M13.1 3.9l-1 1"/><path d="M8 20h9.5a3.7 3.7 0 0 0 .4-7.4 5.3 5.3 0 0 0-10.1 1.2A3.1 3.1 0 0 0 8 20z"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M6.5 19h11a4.2 4.2 0 0 0 .5-8.4 6 6 0 0 0-11.4 1.4A3.5 3.5 0 0 0 6.5 19z"/></symbol>
  <symbol id="i-rain" viewBox="0 0 24 24"><path d="M6.5 15h11a4 4 0 0 0 .5-8 6 6 0 0 0-11.4 1.3A3.4 3.4 0 0 0 6.5 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.7 6.7 0 0 0 10.5 10.5z"/></symbol>
</svg>

<main id="edition">

<!-- ======================= PAGE 1: THE WORLD ======================= -->
<div class="page" id="page-1">
  <div class="ears">
    <div class="ear" id="ear-weather"></div>
    <div class="title"><span id="title"></span></div>
    <div class="ear" id="ear-moon"></div>
  </div>
  <div class="dateline"><span id="volno"></span><span class="js-date"></span><span id="place"></span></div>
  <div class="wstrip" id="wstrip"></div>

  <!-- SCIENCE LEAD -->
  <article id="science"></article>

  <!-- NEWS -->
  <div class="news" id="news">
    <div id="news-india"></div>
    <div id="news-world"></div>
  </div>

  <div class="footer-note"><span id="footer-public"></span><span>Continued on page 2 &rarr;</span></div>
</div>

<!-- ======================= PAGE 2: YOUR DAY ======================= -->
<div class="page" id="page-2">
  <div class="mini-title" id="mini-title"></div>
  <div class="dateline"><span>Personal Edition</span><span class="js-date"></span><span class="js-pageno">Page 2 of 2</span></div>

  <div class="row3" id="row3">
    <section id="schedule"></section>
    <section id="tasks"></section>
    <section id="dates"></section>
  </div>

  <div class="band" id="health"></div>

  <div class="band" id="messages"></div>

  <div class="scores band" id="sports"></div>

  <div class="band" id="comic"></div>

  <div class="footer-note"><span class="js-private"></span><span class="js-printed"></span></div>
</div>

</main>

<div id="fitwarn"></div>
<script src="render.js"></script>
</body>
</html>
